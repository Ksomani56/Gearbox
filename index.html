<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#eceef0;--sf:rgba(255,255,255,.66);--sfs:#fff;--ink:#101215;--mu:#666b72;--ln:rgba(16,18,21,.09);--ac:#16191d;--acs:rgba(16,18,21,.06);--red:#d9363e;--hole:#a7adb4;--gb:rgba(255,255,255,.7);--sh:0 10px 34px rgba(20,25,30,.10);--w1:rgba(255,255,255,.95);--w2:rgba(185,193,204,.55);--w3:rgba(165,172,182,.4);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0d0f;--sf:rgba(34,37,42,.6);--sfs:#1b1d21;--ink:#f1f2f3;--mu:#9aa0a7;--ln:rgba(255,255,255,.09);--ac:#e9ecef;--acs:rgba(255,255,255,.08);--red:#ff6b72;--hole:#4a4f56;--gb:rgba(255,255,255,.08);--sh:0 10px 34px rgba(0,0,0,.4);--w1:rgba(70,76,86,.5);--w2:rgba(50,55,64,.5);--w3:rgba(60,64,72,.4)}}
:root[data-theme="dark"]{--bg:#0c0d0f;--sf:rgba(34,37,42,.6);--sfs:#1b1d21;--ink:#f1f2f3;--mu:#9aa0a7;--ln:rgba(255,255,255,.09);--ac:#e9ecef;--acs:rgba(255,255,255,.08);--red:#ff6b72;--hole:#4a4f56;--gb:rgba(255,255,255,.08);--sh:0 10px 34px rgba(0,0,0,.4);--w1:rgba(70,76,86,.5);--w2:rgba(50,55,64,.5);--w3:rgba(60,64,72,.4)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Manrope,system-ui,-apple-system,sans-serif;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 38% at 12% 0%,var(--w1),transparent 72%),radial-gradient(50% 34% at 100% 18%,var(--w2),transparent 72%),radial-gradient(60% 40% at 55% 100%,var(--w3),transparent 72%)}
.gl,.tile,.case,#q,nav,dialog,#vb{background:var(--sf);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--gb);box-shadow:var(--sh)}
header{max-width:640px;margin:0 auto;padding:18px 16px 4px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-size:25px;font-weight:800;letter-spacing:-.04em;line-height:1}
#vb{width:44px;height:44px;border-radius:50%;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
#q{display:block;width:calc(100% - 32px);max-width:608px;margin:10px auto 0;padding:13px 16px;border-radius:16px;color:var(--ink);font:inherit;box-shadow:none}
main{max-width:640px;margin:0 auto;padding:10px 16px}
h2{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:2px 0 6px;line-height:1.12}
.mu{color:var(--mu);font-size:14px}
.nx{background:linear-gradient(140deg,#2b3036,#0f1215);color:#fff;border-radius:24px;padding:20px;margin:10px 0 14px;box-shadow:0 14px 34px rgba(10,14,18,.3);border:1px solid rgba(255,255,255,.1)}
.nx .mu{color:rgba(255,255,255,.78)}.nx .btn{margin-bottom:0;background:#fff;color:#111418}
.sec{font-weight:700;font-size:15px;margin:22px 0 6px}
.al{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--ln)}
.al::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ac);flex:none}
.ok{padding:13px 0;color:var(--mu)}
.mf{display:flex;align-items:baseline;gap:8px;padding:8px 0}.mf i{flex:1;border-bottom:1.5px dotted var(--ln)}.mf b{font-size:18px;font-variant-numeric:tabular-nums}
.sw{display:flex;gap:4px;background:var(--acs);border-radius:14px;padding:4px;margin:6px 0 14px}
.sw button{flex:1;border:0;background:none;padding:10px 6px;border-radius:11px;font:inherit;font-weight:700;color:var(--mu)}
.sw button.a{background:var(--sfs);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;border-radius:20px;overflow:hidden}
.tp{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.ph{display:flex;align-items:center;justify-content:center;background:var(--acs);color:var(--ac);font-size:46px;font-weight:800}
.tn{padding:10px 12px 12px}.tn b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tn span{font-size:13px;color:var(--mu)}
.chip{position:absolute;top:10px;left:10px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--ac);color:var(--bg)}
.chip.missing,.chip.no{background:var(--red);color:#fff}.chip.yes{background:var(--sfs);color:var(--ink)}
.rowc{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln)}.rowc .t{flex:1;min-width:0}.rowc b{display:block;font-weight:700}
.strip{display:flex}.strip img,.strip div{width:38px;height:38px;border-radius:12px;object-fit:cover;border:2px solid var(--bg);margin-left:-12px;background:var(--acs)}.strip :first-child{margin-left:0}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:16px;background:var(--ac);color:var(--bg);font:inherit;font-weight:700;margin:10px 0;box-shadow:0 8px 20px rgba(0,0,0,.16)}
.btn.g{background:var(--sf);color:var(--ink);border:1px solid var(--gb);box-shadow:none}
.empty{text-align:center;color:var(--mu);padding:36px 8px}
.note{font-size:14px;color:var(--mu);margin:0 0 8px}.ln{text-decoration:underline;color:var(--ink);font-weight:600}
.bk{background:none;border:0;font:inherit;font-weight:700;padding:6px 0;color:var(--ac)}
.case{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;border-radius:24px;padding:12px;margin:10px 0}
.slot{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;display:flex;align-items:flex-end;color:#fff}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .sn{position:relative;width:100%;padding:16px 7px 6px;font-size:12px;font-weight:700;line-height:1.15;background:linear-gradient(transparent,rgba(8,16,30,.72));overflow:hidden;max-height:100%}
.slot.in,.slot.half{background:linear-gradient(140deg,#3b4148,#15181c);border:1px solid rgba(255,255,255,.12)}
.slot.out{border:2px dashed var(--hole);color:var(--mu);align-items:center;justify-content:center;text-align:center;padding:4px}
.slot.out .sn{background:none;padding:0}
.slot .sq{position:absolute;top:6px;right:6px;background:#fff;color:#111418;font-size:12px;font-weight:800;padding:1px 7px;border-radius:999px}
.slot.in::after{content:"";position:absolute;top:7px;right:7px;width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.22)}
.slot.in .sq{display:none}
.seg{display:flex;gap:3px;margin:8px 0}.seg i{flex:1;max-width:24px;min-width:3px;height:8px;border-radius:4px;background:var(--acs);border:0}
.seg i.f{background:var(--ac)}.seg i.p{background:linear-gradient(90deg,var(--ac) 50%,var(--acs) 50%)}
.nx .seg i{background:rgba(255,255,255,.28)}.nx .seg i.f{background:#fff}.nx .seg i.p{background:linear-gradient(90deg,#fff 50%,rgba(255,255,255,.28) 50%)}
nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;display:flex;gap:4px;padding:6px;border-radius:24px}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mu);font:inherit;font-weight:700;font-size:14px;border-radius:18px}nav button{position:relative}nav button.a{color:var(--ac);background:none}
#ni{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 24px)/4);border-radius:18px;background:var(--acs);transform:translateX(calc(var(--i,0)*(100% + 4px)));transition:transform .5s cubic-bezier(.3,1.3,.4,1);pointer-events:none}
dialog{border-radius:28px 28px 0 0;color:var(--ink);width:100%;max-width:520px;margin:auto auto 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90vh;border-bottom:0;background:var(--sfs)}
dialog::backdrop{background:rgba(10,20,40,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog h3{margin:0 0 2px;font-size:21px;font-weight:800;letter-spacing:-.02em}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px;font-weight:600}
dialog input:not([type=checkbox]),dialog select,dialog textarea{width:100%;padding:13px;border:1px solid var(--ln);border-radius:14px;background:var(--acs);color:var(--ink);font:inherit}
.r2{display:flex;gap:10px}.r2>*{flex:1;min-width:0}
.pk{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--ln);margin:0;color:var(--ink);font-size:16px}.pk input{width:22px;height:22px;accent-color:var(--ac)}
.gh{display:flex;justify-content:space-between;margin:12px 0 2px;font-weight:700;font-size:14px;color:var(--ac)}.gh span{padding:2px 6px;text-decoration:underline}
#pv{width:100%;max-height:170px;object-fit:cover;border-radius:14px;margin-top:8px;display:none}
.vr{display:flex;gap:8px}#v_p{margin-top:10px}#v_p div{padding:3px 0}
.kin{width:100%;margin-top:10px;padding:13px;border:1px solid var(--ln);border-radius:14px;background:var(--acs);color:var(--ink);font:inherit}
.warn{border-left:3px solid var(--ac);padding:4px 12px;margin:8px 0}

button,.tile,.slot,.rowc,.al,.btn{transition:transform .2s cubic-bezier(.2,.8,.2,1),background-color .25s ease,color .25s ease,box-shadow .25s ease,opacity .2s ease,border-color .25s ease}
.btn:active,.tile:active,.slot:active,#vb:active,nav button:active,.sw button:active{transform:scale(.95)}
.rowc:active,.al:active{opacity:.55}
.seg i{transition:background .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
main.enter>*{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
main.enter>*:nth-child(2){animation-delay:.05s}main.enter>*:nth-child(3){animation-delay:.1s}main.enter>*:nth-child(4){animation-delay:.15s}main.enter>*:nth-child(5){animation-delay:.2s}main.enter>*:nth-child(n+6){animation-delay:.25s}
@keyframes pop{0%{transform:scale(.86)}55%{transform:scale(1.06)}100%{transform:scale(1)}}
.slot.pop{animation:pop .34s cubic-bezier(.2,.8,.2,1)}
@keyframes sheet{from{transform:translateY(48px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
dialog[open]{animation:sheet .36s cubic-bezier(.2,.8,.2,1)}dialog[open]::backdrop{animation:fade .3s ease}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="brand"><svg viewBox="0 0 32 32" width="32" height="32"><rect width="32" height="32" rx="10" fill="currentColor"/><rect x="7" y="11" width="18" height="12" rx="3" fill="none" style="stroke:var(--bg)" stroke-width="2.2"/><path d="M12 11V8.5h8V11M7 17h18" style="stroke:var(--bg)" stroke-width="2.2" fill="none" stroke-linejoin="round"/></svg>gearbox</div>
<button id="vb" data-a="voice" aria-label="Voice command"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button></header>
<input id="q" type="search" placeholder="Search" style="display:none">
<main id="m"></main>
<nav id="nv"><i id="ni"></i><button data-a="tab" data-v="home">Home</button><button data-a="tab" data-v="gear">Gear</button><button data-a="tab" data-v="kits">Kits</button><button data-a="tab" data-v="data">Backup</button></nav>
<dialog id="d"><div id="dc"></div></dialog>
<input id="rf" type="file" accept=".json,application/json" hidden>
<script>
(function(){
var K="gear-locker-v2",S={c:[],i:[],k:[],s:[]},V="home",GS="items",O=null,Q="",SF="",KM="pack",photo="";
var ST={ok:"Available",lent:"Lent out",repair:"In repair",missing:"Missing"},BL={yes:"Backed up",partly:"Partly",no:"Not backed up"};
var $=function(i){return document.getElementById(i)};
try{var r=JSON.parse(localStorage.getItem(K)||"null");if(r&&r.c&&r.i&&r.k)S=r}catch(e){}
S.s=S.s||[];
var LT="";
function save(){try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){alert("Storage is full. Remove some photos.");return false}}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function by(a,id){return a.filter(function(x){return x.id===id})[0]}
function match(n){return !Q||n.toLowerCase().indexOf(Q.toLowerCase())>=0}
function day(o){var d=new Date();d.setDate(d.getDate()+(o||0));return d.toISOString().slice(0,10)}
function fd(d){return new Date(d+"T00:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})}
function g(k,i,m){var v=(k[m||"ck"]||{})[i.id];return v===true?(+i.qty||1):(+v||0)}
function fu(k,i,m){return g(k,i,m)>=(+i.qty||1)}
function its(k){return k.ids.map(function(x){return by(S.i,x)}).filter(Boolean)}
function prog(k,m){var l=its(k);return{n:l.length,d:l.filter(function(i){return fu(k,i,m)}).length}}
function seg(k,m){return'<div class="seg">'+its(k).map(function(i){return'<i class="'+(fu(k,i,m)?'f':g(k,i,m)?'p':'')+'"></i>'}).join("")+'</div>'}
function cname(i){var c=by(S.c,i.cid);return c?c.name:"No container"}
function img(i,cls){return i.photo?'<img class="'+cls+'" src="'+i.photo+'" alt="">':'<div class="'+cls+' ph">'+esc((i.name||"?").charAt(0).toUpperCase())+'</div>'}
function tile(i,a){var bad=i.st&&i.st!=="ok";return'<div class="tile" data-a="'+a+'" data-id="'+i.id+'">'+img(i,"tp")+(bad?'<span class="chip '+i.st+'">'+ST[i.st]+'</span>':'')+'<div class="tn"><b>'+esc(i.name)+(i.qty>1?' ×'+i.qty:'')+'</b><span>'+esc(cname(i))+'</span></div></div>'}
function okI(i){if(!match(i.name))return false;if(SF==="attn")return i.st&&i.st!=="ok";if(SF==="nocont")return!by(S.c,i.cid);if(SF==="svc")return i.due&&i.due<=day(7);return true}
function slot(k,i,m){var f=fu(k,i,m),n=g(k,i,m),q=+i.qty||1;return'<div class="slot '+(f?'in':n?'half':'out')+(LT===i.id?' pop':'')+'" data-a="tick" data-id="'+i.id+'">'+(i.photo&&(f||n)?'<img src="'+i.photo+'" alt="">':'')+'<span class="sn">'+esc(i.name)+'</span>'+(q>1?'<span class="sq">'+n+'/'+q+'</span>':'')+'</div>'}
function al(t,v,g2,f){return'<div class="al" data-a="jump" data-v="'+v+'" data-g="'+(g2||"")+'" data-f="'+(f||"")+'"><div>'+t+'</div></div>'}
function home(){
 var t=day(),nx=S.k.filter(function(k){return k.date&&k.date>=t}).sort(function(a,b){return a.date<b.date?-1:1})[0],h="";
 if(nx){var p=prog(nx,"ck");h+='<section class="nx" data-a="openKit" data-id="'+nx.id+'"><div class="mu">Next shoot, '+fd(nx.date)+'</div><h2>'+esc(nx.name)+'</h2>'+seg(nx,"ck")+'<div class="mu">'+p.d+' of '+p.n+' packed</div></section>'}
 else h+='<section class="nx"><div class="mu">No shoot planned</div><h2>Open a kit, set a date</h2><button class="btn y" data-a="tab" data-v="kits">Go to kits</button></section>';
 var bad=S.s.filter(function(c){return c.backup!=="yes"}).length,att=S.i.filter(function(i){return i.st&&i.st!=="ok"}).length,nc=S.i.filter(function(i){return!by(S.c,i.cid)}).length,sv=S.i.filter(function(i){return i.due&&i.due<=day(7)}).length,a="";
 if(bad)a+=al('<b>'+bad+' SD card'+(bad>1?'s':'')+'</b> not fully backed up',"gear","cards");
 if(att)a+=al('<b>'+att+' item'+(att>1?'s':'')+'</b> lent out, in repair or missing',"gear","items","attn");
 if(sv)a+=al('<b>'+sv+' item'+(sv>1?'s':'')+'</b> due for service',"gear","items","svc");
 if(nc)a+=al('<b>'+nc+' item'+(nc>1?'s':'')+'</b> with no container',"gear","items","nocont");
 h+='<div class="sec">Needs attention</div>'+(a||'<div class="ok">Nothing right now.</div>');
 var pcs=S.i.reduce(function(x,i){return x+(+i.qty||1)},0);
 h+='<div class="sec">In the box</div>'+[["Items",S.i.length],["Pieces",pcs],["Containers",S.c.length],["Kits",S.k.length],["SD cards",S.s.length]].map(function(r){return'<div class="mf">'+r[0]+'<i></i><b>'+r[1]+'</b></div>'}).join("");
 return h}
function gear(){
 var h='<div class="sw">'+[["items","Items"],["cont","Containers"],["cards","SD cards"]].map(function(x){return'<button data-a="gs" data-v="'+x[0]+'" class="'+(GS===x[0]?"a":"")+'">'+x[1]+'</button>'}).join("")+'</div>';
 if(GS==="items"){
  if(SF)h+='<div class="note">Filtered. <span class="ln" data-a="clearf">Show all</span></div>';
  var l=S.i.filter(okI);
  h+=(l.length?'<div class="grid">'+l.map(function(i){return tile(i,"editItem")}).join("")+'</div>':'<div class="empty">'+(S.i.length?"No matches.":"Your gear list is empty. Add your first item.")+'</div>')+'<button class="btn y" data-a="newItem">Add item</button><button class="btn g" data-a="quick">Quick add many</button>';
 }else if(GS==="cont"){
  if(O&&by(S.c,O)){var c=by(S.c,O),l2=S.i.filter(function(i){return i.cid===O&&match(i.name)});
   h+='<button class="bk" data-a="back">Back</button><h2>'+esc(c.name)+'</h2>'+(l2.length?'<div class="grid">'+l2.map(function(i){return tile(i,"editItem")}).join("")+'</div>':'<div class="empty">Nothing in here yet.</div>')+'<button class="btn g" data-a="delCont">Delete container</button>';
  }else{O=null;
   h+=(S.c.filter(function(c){return match(c.name)}).map(function(c){var l3=S.i.filter(function(i){return i.cid===c.id});return'<div class="rowc" data-a="openCont" data-id="'+c.id+'"><div class="strip">'+(l3.slice(0,4).map(function(i){return i.photo?'<img src="'+i.photo+'" alt="">':'<div></div>'}).join("")||'<div></div>')+'</div><div class="t"><b>'+esc(c.name)+'</b><span class="mu">'+l3.length+' items</span></div></div>'}).join("")||'<div class="empty">No containers yet. Add your bags, cases and boxes.</div>')+'<button class="btn y" data-a="newCont">New container</button>';}
 }else{
  var bd=S.s.filter(function(c){return c.backup!=="yes"}).length;
  h+=(bd?'<div class="warn"><b>'+bd+' of '+S.s.length+' cards not fully backed up.</b></div>':'')+
  (S.s.filter(function(c){return match(c.name)}).length?'<div class="grid">'+S.s.filter(function(c){return match(c.name)}).map(function(c){return'<div class="tile" data-a="editCard" data-id="'+c.id+'">'+img(c,"tp")+'<span class="chip '+c.backup+'">'+BL[c.backup]+'</span><div class="tn"><b>'+esc(c.name)+'</b><span>'+esc(c.contents||"No notes yet")+'</span></div></div>'}).join("")+'</div>':'<div class="empty">No SD cards yet. Add each card with a photo and what is on it.</div>')+'<button class="btn y" data-a="newCard">Add SD card</button>';}
 return h}
function kitsV(){
 var k=O&&by(S.k,O);
 if(k){var m=KM==="pack"?"ck":"rt",l=its(k),p=prog(k,m),ms=l.filter(function(i){return!fu(k,i,m)});
  var h='<button class="bk" data-a="back">Back</button><h2>'+esc(k.name)+'</h2><div class="mu">'+(k.date?fd(k.date):"No shoot date")+'</div>'+
  '<div class="sw"><button data-a="km" data-v="pack" class="'+(KM==="pack"?"a":"")+'">Pack</button><button data-a="km" data-v="ret" class="'+(KM==="ret"?"a":"")+'">Return check</button></div>'+
